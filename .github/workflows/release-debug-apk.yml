name: Release debug APK from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: debug-apk-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  release-debug-apk:
    if: >-
      github.event.issue.pull_request == null &&
      (
        contains(github.event.issue.labels.*.name, 'release debug-apk') ||
        contains(github.event.issue.labels.*.name, 'release-debug-apk') ||
        (contains(github.event.issue.labels.*.name, 'release') &&
         contains(github.event.issue.labels.*.name, 'debug-apk'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      RELEASE_TAG: debug-apk-v${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check whether this issue is already complete
        id: completion-guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_state="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body')"

          if [ "$issue_state" = "CLOSED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release_complete=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$comments" | grep -Fq '<!-- debug-apk-release:complete -->'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "release_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "release_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post build started update
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf '🛠️ Debug APK build started. I will post the build result here.\n\nIssue: %s\nWorkflow run: %s' "$ISSUE_URL" "$RUN_URL")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Checkout default branch commit
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: |-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Install JavaScript dependencies
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        run: npm ci

      - name: Build web app
        id: web-build
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        run: npm run build

      - name: Sync Capacitor Android project
        id: capacitor-sync
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        run: npx cap sync android

      - name: Assemble debug APK
        id: apk-build
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK workflow artifact
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aaptha-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub code release
        id: publish-release
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          notes="$(printf 'Debug APK requested by issue #%s.\nCommit: %s\nWorkflow: %s' "$ISSUE_NUMBER" "$GITHUB_SHA" "$RUN_URL")"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Aaptha Care Debug APK $RELEASE_TAG" \
              --notes "$notes"
          fi

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Post completion and close issue
        id: close-issue
        if: steps.completion-guard.outputs.skip != 'true' && steps.completion-guard.outputs.release_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.publish-release.outputs.url }}
        run: |
          body="$(printf '%s\n' \
            '<!-- debug-apk-release:complete -->' \
            '✅ Debug APK build and release completed.' \
            '' \
            "Tag: $RELEASE_TAG" \
            "APK: $RELEASE_URL" \
            "Workflow: $RUN_URL" \
            '' \
            'Closing this issue.')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Close issue after a previously completed release
        id: recovery-close
        if: steps.completion-guard.outputs.release_complete == 'true' && steps.completion-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Post failure details
        if: failure() && steps.completion-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_BUILD_STATUS: ${{ steps.web-build.outcome || 'not run' }}
          CAPACITOR_SYNC_STATUS: ${{ steps.capacitor-sync.outcome || 'not run' }}
          APK_BUILD_STATUS: ${{ steps.apk-build.outcome || 'not run' }}
          RELEASE_STATUS: ${{ steps.publish-release.outcome || 'not run' }}
          CLOSE_STATUS: ${{ steps.close-issue.outcome || 'not run' }}
          RECOVERY_CLOSE_STATUS: ${{ steps.recovery-close.outcome || 'not run' }}
        run: |
          body="$(printf '%s\n' \
            '❌ Debug APK release workflow failed.' \
            '' \
            "Web build: $WEB_BUILD_STATUS" \
            "Capacitor sync: $CAPACITOR_SYNC_STATUS" \
            "APK build: $APK_BUILD_STATUS" \
            "GitHub release: $RELEASE_STATUS" \
            "Issue close: $CLOSE_STATUS" \
            "Recovery close: $RECOVERY_CLOSE_STATUS" \
            '' \
            "Details and logs: $RUN_URL")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
